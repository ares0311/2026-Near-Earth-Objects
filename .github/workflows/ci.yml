name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Feature branches are validated by the pull_request event; restricting push
# runs to main avoids executing the identical suite twice for the same PR SHA.
# A newer commit to the same PR/main branch supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Python 3.14.3 matches the project venv (.venv) on the operator Mac.
        # uv manages the venv from uv.lock so CI uses identical pinned deps.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v5

      # Install uv — used to sync the venv from uv.lock, matching the local .venv exactly.
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      # Sync all dev dependencies from the lockfile — no loose pip installs.
      - name: Install dependencies (from uv.lock)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: |
          uv run python -m mypy src \
            --ignore-missing-imports \
            --no-strict-optional \
            --disable-error-code=no-any-return \
            --disable-error-code=type-arg \
            --disable-error-code=misc \
            --disable-error-code=unused-ignore

      # Coverage is measured against the *production runtime denominator* named
      # in .coveragerc.production: src/ plus the orchestrator, operator shell,
      # and interaction layer under Skills/. Measuring src/ alone was field
      # blocker NEO-FIELD-02 -- it excluded the canonical router and the shell,
      # which is precisely the omission contract rule CLAIM-02 forbids.
      #
      # The floor is 98, which is the measured value of that denominator, not a
      # round number chosen for comfort. src/ is separately held at 100% by the
      # step below, so this threshold cannot mask a regression in src/.
      - name: Test
        run: |
          uv run python -m pytest \
            -m "not integration_live" \
            -vv \
            -n 2 \
            --dist=loadfile \
            --timeout=120 \
            --timeout-method=thread \
            --cov-config=.coveragerc.production \
            --cov=src \
            --cov=Skills \
            --cov-report=term-missing \
            --cov-report=json:coverage-production.json \
            --cov-fail-under=98
        env:
          PYTHONPATH: src
          # Keep each xdist process from creating a second, unbounded native
          # thread pool. Two pytest workers still overlap independent test
          # files while remaining below the hosted runner's process ceiling.
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"

      # The production floor above is an aggregate. This step keeps the stricter
      # per-package guarantee that src/ has always carried, so a regression there
      # cannot hide inside the larger denominator.
      - name: Assert src/ remains at 100% statement coverage
        run: uv run python Skills/check_coverage_denominator.py coverage-production.json

  hunter-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv with Python 3.14
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.14"

      - name: Install locked build dependencies
        run: uv sync --locked --extra dev

      - name: Build distribution
        run: uv build

      - name: Install and smoke-test built Hunter artifact
        run: uv run --python 3.14 python Skills/verify_hunter_distribution.py --wheel-dir dist
