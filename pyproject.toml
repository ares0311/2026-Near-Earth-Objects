[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-detection"
version = "0.91.1"
description = "Near-Earth Object Detection and Ranking Pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "numpy>=2.4,<3",
    "scipy>=1.17,<2",
    "astropy>=7.2,<8",
    "astroquery>=0.4.6",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "requests>=2.33,<3",
    "alerce>=2,<3",
    "fastavro>=1.9,<2",
    # Terminal interaction framework for the NEOHunter shell. docs/CLI_UX_SPEC.md
    # section 12 directs using an established framework rather than hand-written
    # escape-sequence handling; this powers the command palette and guided entry.
    # Declared explicitly rather than relied on transitively.
    "prompt_toolkit>=3.0,<4",
]

[project.scripts]
NEO-Hunter = "hunter_commands:neo_hunter"
NEOHunter = "hunter_commands:neo_hunter"
Create-New-Search = "hunter_commands:create_new_search"
Run-New-Search = "hunter_commands:run_new_search"
Show-Follow-Ups = "hunter_commands:show_follow_ups"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.1",
    "mypy>=1.6",
]
training = [
    # Kept for compatibility; ALeRCE is also a runtime source provider.
    "alerce>=2,<3",
]

[tool.setuptools]
# Two package roots: top-level modules live under src/, and the Skills package
# lives at the repository root. Both mappings are required -- omitting the
# Skills entry produces an editable install that exposes only src/, which is
# field blocker NEO-FIELD-01 (ModuleNotFoundError: No module named 'Skills').
# tests/test_hunter_launch_surfaces.py guards this.
package-dir = {"" = "src", "Skills" = "Skills"}
# hunter_ux must be listed explicitly: setuptools does not recurse into
# subpackages of an explicitly enumerated package list.
packages = ["Skills", "Skills.hunter_ux"]
py-modules = [
    "alert",
    "background",
    "calibration",
    "candidate_ledger",
    "canonical_eval",
    "classify",
    "detect",
    "fetch",
    "grouped_splits",
    "hunter_commands",
    "hunter_config",
    "hunter_cross_project",
    "hunter_logging",
    "hunter_state",
    "known_object_exclusion",
    "link",
    "orbit",
    "preprocess",
    "promotion_report",
    "recovery_curves",
    "schemas",
    "score",
]

[tool.setuptools.data-files]
"data_selection" = ["data_selection/target_priority_queue.csv"]
"data_selection/ranking_policies" = ["data_selection/ranking_policies/*.json"]
"data_selection/coverage_inventories" = ["data_selection/coverage_inventories/*.json"]
"docs/evidence/live" = ["docs/evidence/live/2026-07-25-elongation-peak-revision.md"]
"models" = [
    "models/tier1_xgb.json",
    "models/tier2_cnn_v4.pt",
    "models/tier3_transformer.pt",
    "models/stacker_coef.json",
]

[tool.ruff]
line-length = 100
# py314 is not yet a valid ruff target-version; py313 is the highest supported value.
# Update to py314 once ruff adds support.
target-version = "py313"
# Exclude shell scripts — ruff only lints Python files
exclude = ["Skills/*.sh"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration_live: marks tests requiring live network access (deselect with '-m not integration_live')",
]
addopts = "-m 'not integration_live'"

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
